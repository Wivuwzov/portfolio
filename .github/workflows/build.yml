name: Build Forge 1.20.1 Mod

on:
  push:
    branches:
      - telegramauth-forge-1201-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Minecraft Forge jar
        run: gradle build --no-daemon --stacktrace
      - name: Upload Forge jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAuth-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
